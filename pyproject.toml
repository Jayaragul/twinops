[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "twinforge"
version = "0.1.0"
description = "An engine for building, simulating and analysing industrial digital twins."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["digital-twin", "simulation", "discrete-event", "manufacturing", "factory"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = ["pyyaml>=5.4"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
twin = "twinforge.cli:main"

[tool.setuptools.packages.find]
include = ["twinforge*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
